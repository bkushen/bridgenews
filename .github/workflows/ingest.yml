name: BridgeNews Feed Ingestion

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger verified RSS ingestion
        env:
          FUNCTION_URL: https://majaoccykpdozuzehmpb.supabase.co/functions/v1/ingest-rss
          SUPABASE_INGEST_JWT: ${{ secrets.BRIDGENEWS_INGEST_JWT }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_INGEST_JWT"
          curl --fail-with-body --retry 2 --retry-delay 5 \
            --request POST "$FUNCTION_URL" \
            --header "Authorization: Bearer $SUPABASE_INGEST_JWT" \
            --header "Content-Type: application/json" \
            --data '{}'
