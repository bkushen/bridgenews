services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bridgenews-web
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "3000"
    networks:
      - bridgenews
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    container_name: bridgenews-caddy
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    env_file:
      - .env.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - bridgenews

networks:
  bridgenews:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
