services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bridgenews-web
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "3000"
    networks:
      - bridgenews
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    container_name: bridgenews-nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/bridgenews.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    networks:
      - bridgenews

networks:
  bridgenews:
    driver: bridge
